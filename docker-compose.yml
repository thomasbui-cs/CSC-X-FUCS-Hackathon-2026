services:
  backend:
    build:
      context: ./backend
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      ORS_API_KEY: ${ORS_API_KEY:?set ORS_API_KEY in .env}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the JS bundle at build time (Vite), not read at container runtime.
        # Must be reachable from the *browser*, not from inside the frontend container —
        # http://localhost:3000 only works when browser and Docker host are the same machine.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - '5173:80'
    depends_on:
      - backend
    restart: unless-stopped
